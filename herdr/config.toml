onboarding = false

[keys]
prefix = "ctrl+i"
split_vertical = "prefix+l"
split_horizontal = "prefix+j"
new_tab = "prefix+t"
next_tab = "prefix+]"
previous_tab = "prefix+["
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
previous_agent = "prefix+shift+h"
next_agent = "prefix+shift+l"
copy_mode = ["prefix+c", "alt+q"]
zoom = "prefix+f"
close_pane = "prefix+q"
close_tab = "prefix+shift+q"
detach = "ctrl+x"
new_workspace = "prefix+n"
goto = "prefix+s"
settings = "prefix+shift+s"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Keep direct Ctrl+h/j/k/l editor-aware; prefix+j/l are split commands.
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"
resize_pane_left = "prefix+alt+h"
resize_pane_down = "prefix+alt+j"
resize_pane_up = "prefix+alt+k"
resize_pane_right = "prefix+alt+l"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch shell (exit to close)"
width = "60%"
height = "70%"

[terminal]
new_cwd = "follow"

[theme]
name = "terminal"

# Match the former tmux Nova palette; terminal supplies semantic ANSI colors.
[theme.custom]
panel_bg = "#0a0a0a"
sidebar_bg = "#0a0a0a"
active_row_bg = "#0a0a0a"
selection_bg = "#1f2425"
surface0 = "#1f2425"
surface1 = "#1f2425"
surface_dim = "#0a0a0a"
overlay0 = "#737373"
overlay1 = "#9a9a9a"
text = "#f5f5f5"
subtext0 = "#737373"
accent = "#818cf8"

[ui]
tab_bar_position = "bottom"
pane_outer_borders = false
pane_gaps = false
